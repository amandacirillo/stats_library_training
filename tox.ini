# tox (https://tox.readthedocs.io/) runs the test suite against a matrix of
# supported pandas versions, so a pandas upgrade that silently breaks one of
# our functions (e.g. a Series.corr() behavior change) is caught in CI
# before it ships to anyone consuming this library.
#
# Note: pandas==2.2.0 has no prebuilt wheel for Python 3.13 (that support
# landed in 2.2.3), so CI only runs the pandas220 env on 3.11/3.12 -- see
# .github/workflows/ci.yml.
[tox]
envlist = pandas{220,223}

[testenv]
commands = pytest {posargs}
deps =
    pytest
    pytest-cov
    pandas220: pandas==2.2.0
    pandas223: pandas==2.2.3
