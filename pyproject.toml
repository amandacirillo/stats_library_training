[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "training-stats-library"
version = "0.1.0"
description = "Example statistics library packaged for internal artifact-registry distribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.1,<=2.2.3",
    "numpy<=2.2.2",
]

[project.urls]
"Homepage" = "https://github.com/amandacirillo/stats_library_training"

[tool.setuptools.packages.find]
where = ["src"]
